basePath: /
definitions:
  internal_adapter_http.createRoomRequest:
    properties:
      name:
        type: string
      openchat_url:
        type: string
    type: object
  internal_adapter_http.joinRoomRequest:
    properties:
      invite_code:
        type: string
    type: object
  internal_adapter_http.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  internal_adapter_http.signUpRequest:
    properties:
      email:
        type: string
      nickname:
        type: string
      password:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: gachita API
  title: Gachita API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 로그인 정보
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_adapter_http.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 로그인
      tags:
      - auth
  /api/auth/signup:
    post:
      consumes:
      - application/json
      parameters:
      - description: 가입 정보
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_adapter_http.signUpRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 회원가입
      tags:
      - auth
  /api/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 내 정보 조회
      tags:
      - user
  /api/rooms:
    post:
      consumes:
      - application/json
      parameters:
      - description: 방 정보
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_adapter_http.createRoomRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 방 생성
      tags:
      - room
  /api/rooms/{id}:
    get:
      parameters:
      - description: 방 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 방 조회
      tags:
      - room
  /api/rooms/join:
    post:
      consumes:
      - application/json
      parameters:
      - description: 초대 코드
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_adapter_http.joinRoomRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 방 입장
      tags:
      - room
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
