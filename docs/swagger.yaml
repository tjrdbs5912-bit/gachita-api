basePath: /
definitions:
  HubStopResponse:
    properties:
      id:
        type: string
      name:
        type: string
      room_id:
        type: string
      sort_order:
        type: string
    type: object
  JoinRoomResponse:
    properties:
      id:
        type: string
      invite_code:
        type: string
      name:
        type: string
    type: object
  LoginResponse:
    properties:
      access_token:
        type: string
      token_type:
        type: string
    type: object
  MatchDetailResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      members:
        items:
          $ref: '#/definitions/MatchMemberResponse'
        type: array
      room_id:
        type: string
      status:
        type: string
    type: object
  MatchMemberResponse:
    properties:
      from_stop_id:
        type: string
      nickname:
        type: string
      queue_entry_id:
        type: string
      time_end:
        type: string
      time_start:
        type: string
      to_stop_id:
        type: string
      user_id:
        type: string
    type: object
  MatchResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      room_id:
        type: string
      status:
        type: string
    type: object
  MessageResponse:
    properties:
      message:
        type: string
    type: object
  NotificationResponse:
    properties:
      body:
        type: string
      created_at:
        type: string
      id:
        type: string
      read_at:
        type: string
      ref_id:
        type: string
      ref_type:
        type: string
      title:
        type: string
      type:
        type: string
    type: object
  QueueEntryResponse:
    properties:
      from_stop_id:
        type: string
      id:
        type: string
      match_id:
        type: string
      max_seats:
        type: string
      min_seats:
        type: string
      room_id:
        type: string
      status:
        type: string
      time_end:
        type: string
      time_start:
        type: string
      to_stop_id:
        type: string
      user_id:
        type: string
    type: object
  RoomDetailResponse:
    properties:
      id:
        type: string
      invite_code:
        type: string
      members:
        items:
          $ref: '#/definitions/RoomMemberResponse'
        type: array
      name:
        type: string
      openchat_url:
        type: string
      owner_id:
        type: string
    type: object
  RoomMemberResponse:
    properties:
      email:
        type: string
      nickname:
        type: string
      user_id:
        type: string
    type: object
  RoomResponse:
    properties:
      id:
        type: string
      invite_code:
        type: string
      name:
        type: string
      openchat_url:
        type: string
      owner_id:
        type: string
    type: object
  UserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      nickname:
        type: string
    type: object
  httpadapter.createHubStopRequest:
    properties:
      name:
        type: string
      sort_order:
        type: integer
    type: object
  httpadapter.createQueueEntryRequest:
    properties:
      from_stop_id:
        type: string
      max_seats:
        type: integer
      min_seats:
        type: integer
      time_end:
        type: string
      time_start:
        type: string
      to_stop_id:
        type: string
    type: object
  httpadapter.createRoomRequest:
    properties:
      name:
        type: string
      openchat_url:
        type: string
    type: object
  httpadapter.joinRoomRequest:
    properties:
      invite_code:
        type: string
    type: object
  httpadapter.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  httpadapter.signUpRequest:
    properties:
      email:
        type: string
      nickname:
        type: string
      password:
        type: string
    type: object
  httpadapter.updateHubStopRequest:
    properties:
      name:
        type: string
      sort_order:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: gachita API
  title: Gachita API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 로그인 정보
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpadapter.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LoginResponse'
      summary: 로그인
      tags:
      - auth
  /api/auth/signup:
    post:
      consumes:
      - application/json
      parameters:
      - description: 가입 정보
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpadapter.signUpRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/UserResponse'
      summary: 회원가입
      tags:
      - auth
  /api/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UserResponse'
      security:
      - BearerAuth: []
      summary: 내 정보 조회
      tags:
      - user
  /api/notifications:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/NotificationResponse'
            type: array
      security:
      - BearerAuth: []
      summary: 내 알림 목록
      tags:
      - notification
  /api/notifications/{notificationId}/read:
    put:
      parameters:
      - description: 알림 ID
        in: path
        name: notificationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/NotificationResponse'
      security:
      - BearerAuth: []
      summary: 알림 읽음 처리
      tags:
      - notification
  /api/notifications/read-all:
    put:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/MessageResponse'
      security:
      - BearerAuth: []
      summary: 알림 전체 읽음 처리
      tags:
      - notification
  /api/rooms:
    post:
      consumes:
      - application/json
      parameters:
      - description: 방 정보
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpadapter.createRoomRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/RoomResponse'
      security:
      - BearerAuth: []
      summary: 방 생성
      tags:
      - room
  /api/rooms/{id}:
    get:
      parameters:
      - description: 방 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/RoomDetailResponse'
      security:
      - BearerAuth: []
      summary: 방 조회
      tags:
      - room
  /api/rooms/{id}/matches:
    get:
      parameters:
      - description: 방 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/MatchResponse'
            type: array
      security:
      - BearerAuth: []
      summary: 매칭 목록
      tags:
      - match
  /api/rooms/{id}/matches/{matchId}:
    get:
      parameters:
      - description: 방 ID
        in: path
        name: id
        required: true
        type: string
      - description: 매칭 ID
        in: path
        name: matchId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/MatchDetailResponse'
      security:
      - BearerAuth: []
      summary: 매칭 상세 (멤버 포함)
      tags:
      - match
  /api/rooms/{id}/queue:
    get:
      parameters:
      - description: 방 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/QueueEntryResponse'
            type: array
      security:
      - BearerAuth: []
      summary: 매칭 대기 목록
      tags:
      - queue
    post:
      consumes:
      - application/json
      parameters:
      - description: 방 ID
        in: path
        name: id
        required: true
        type: string
      - description: 대기 정보
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpadapter.createQueueEntryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/QueueEntryResponse'
      security:
      - BearerAuth: []
      summary: 매칭 대기 등록
      tags:
      - queue
  /api/rooms/{id}/queue/{entryId}:
    delete:
      parameters:
      - description: 방 ID
        in: path
        name: id
        required: true
        type: string
      - description: 대기 ID
        in: path
        name: entryId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/QueueEntryResponse'
      security:
      - BearerAuth: []
      summary: 매칭 대기 취소
      tags:
      - queue
  /api/rooms/{id}/stops:
    get:
      parameters:
      - description: 방 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/HubStopResponse'
            type: array
      security:
      - BearerAuth: []
      summary: 거점 목록
      tags:
      - hub_stop
    post:
      consumes:
      - application/json
      parameters:
      - description: 방 ID
        in: path
        name: id
        required: true
        type: string
      - description: 거점 정보
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpadapter.createHubStopRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/HubStopResponse'
      security:
      - BearerAuth: []
      summary: 거점 추가
      tags:
      - hub_stop
  /api/rooms/{id}/stops/{stopId}:
    delete:
      parameters:
      - description: 방 ID
        in: path
        name: id
        required: true
        type: string
      - description: 거점 ID
        in: path
        name: stopId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/MessageResponse'
      security:
      - BearerAuth: []
      summary: 거점 삭제
      tags:
      - hub_stop
    put:
      consumes:
      - application/json
      parameters:
      - description: 방 ID
        in: path
        name: id
        required: true
        type: string
      - description: 거점 ID
        in: path
        name: stopId
        required: true
        type: string
      - description: 거점 정보
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpadapter.updateHubStopRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/HubStopResponse'
      security:
      - BearerAuth: []
      summary: 거점 수정
      tags:
      - hub_stop
  /api/rooms/join:
    post:
      consumes:
      - application/json
      parameters:
      - description: 초대 코드
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpadapter.joinRoomRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/JoinRoomResponse'
      security:
      - BearerAuth: []
      summary: 방 입장
      tags:
      - room
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
